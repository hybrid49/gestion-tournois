services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tournois
      POSTGRES_USER: tournois
      POSTGRES_PASSWORD: tournois
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournois -d tournois"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: dev
      APP_SECRET: change_me_in_production_please_32chars
      DATABASE_URL: postgresql://tournois:tournois@postgres:5432/tournois?serverVersion=16&charset=utf8
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./frontend/dist:/var/www/frontend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ""
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - nginx

volumes:
  postgres_data:
